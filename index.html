<!DOCTYPE html>
<html ng-app="inspinia">

<head>
    <!-- VERSION 1.3.1 CHECK -->

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Unregister Service Workers -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                registrations.forEach(function(registration) {
                    registration.unregister();
                    console.log('Service Worker unregistered');
                });
            });
        }
    </script>

    <!-- Page title set in pageTitle directive -->
    <title page-title></title>

    <!-- Bootstrap -->
    <link href="css/bootstrap.min.css?v=1.1.5" rel="stylesheet">
    <link href="css/cadastromusic-embed.css?v=1.0.1" rel="stylesheet">

    <!-- Font awesome -->
    <link href="font-awesome/css/font-awesome.css?v=1.1.5" rel="stylesheet">
    <!-- Font Awesome 6 (for newer icons like fa-hands) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Main Inspinia CSS files -->
    <link href="css/animate.css?v=1.1.5" rel="stylesheet">
    <!-- Sweet Alert -->
    <link href="css/plugins/sweetalert/sweetalert.css?v=1.1.5" rel="stylesheet">
    <link id="loadBefore" href="css/style.css?v=1.1.5" rel="stylesheet">
    <link href="css/app-standards.css?v=1.0.0" rel="stylesheet">
    <style>
        .label-pink {
            background-color: #d63384 !important;
            color: white !important;
        }
    </style>

</head>

<!-- ControllerAs syntax -->
<!-- Main controller with serveral data used in Inspinia theme on diferent view -->

<body ng-controller="MainCtrl as main" class="{{$state.current.data.specialClass}}" landing-scrollspy id="page-top">

    <!-- Sweet alert -->
